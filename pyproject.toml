[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-codemirror"
version = "2026.04.05.01"
description = "Vendored CodeMirror editor widgets for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "Django>=4.2",
]

[project.entry-points."ophix.plugins"]
ophix_codemirror = "ophix_codemirror"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ophix_codemirror = [
    "static/**/*",
]
